name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to rebuild and publish, such as v1.0.4; empty runs verification only
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bshare-installers-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-number: ${{ steps.metadata.outputs.build-number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve shared installer version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: >-
          python3 tool/ci_metadata.py
          --run-number "$GITHUB_RUN_NUMBER"
          --github-output "$GITHUB_OUTPUT"
          --tag "$RELEASE_TAG"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          # Jammy runners ship LLVM 14 unwind headers that conflict with the
          # distro libunwind-dev required by GStreamer (runner-images#9546).
          sudo apt-get install --no-install-recommends -y libunwind-dev libunwind-14-dev- \
            g++ libgtk-3-dev pkg-config xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgdk-pixbuf-2.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install verification tool dependencies
        run: python3 -m pip install --requirement tool/requirements-test.txt
      - name: Analyze Dart
        run: dart analyze --fatal-infos
      - name: Flutter regression suite
        run: flutter --suppress-analytics test --no-pub
      - name: Packaging and media verification tools
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Native Linux shutdown ownership
        run: python3 test/native/test_linux_window_shutdown.py
      - name: Native Linux window decorations
        run: xvfb-run -a python3 test/native/test_linux_native_decorations.py
      - name: Native Linux virtual-camera IPC and output ownership
        run: python3 test/native/test_linux_virtual_camera.py
      - name: Native Linux photo and recording encoders
        run: python3 test/native/test_linux_camera_media_writer.py
      - name: Windows messenger shutdown ownership
        run: python3 third_party/flutter_webrtc/test/native/test_windows_messenger_lifecycle.py
      - name: Windows LAN classification and route preference
        run: python3 test/native/test_windows_lan_interface_policy.py
      - name: Desktop screen capture startup and cleanup
        run: python3 third_party/flutter_webrtc/test/native/test_desktop_capture_startup.py
      - name: Set up Java for Android native regression checks
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android video codec and encoder lifecycle
        run: |
          python3 third_party/flutter_webrtc/test/native/test_android_video_codec_factories.py
          python3 third_party/flutter_webrtc/test/native/test_android_video_encoder_lifecycle.py
          python3 third_party/flutter_webrtc/test/native/test_screen_capturer.py
          python3 third_party/flutter_webrtc/test/native/test_hidden_screen_renderer.py
      - name: Android playback audio and microphone isolation
        run: |
          python3 third_party/flutter_webrtc/test/native/test_android_playback_audio_capture.py
          python3 third_party/flutter_webrtc/test/native/test_android_audio_recording_gate.py
          python3 third_party/flutter_webrtc/test/native/test_video_capturer_disposal.py
      - name: Android camera controls and merged capture requests
        run: |
          python3 third_party/flutter_webrtc/test/native/test_camera_capture_controls.py
          python3 third_party/flutter_webrtc/test/native/test_camera_torch.py

  windows:
    name: Windows installer
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || inputs.release_tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      release-tag: ${{ needs.prepare_release.outputs.upload_tag }}
      flutter-version: '3.47.2'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  linux:
    name: Linux DEB and RPM
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || inputs.release_tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      release-tag: ${{ needs.prepare_release.outputs.upload_tag }}
      flutter-version: '3.47.2'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  android:
    name: Android signed APK
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || inputs.release_tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/build-android.yml
    with:
      release-tag: ${{ needs.prepare_release.outputs.upload_tag }}
      flutter-version: '3.47.2'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}
      require-signing: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  macos:
    name: macOS ARM64 and x64 PKGs
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || inputs.release_tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      release-tag: ${{ needs.prepare_release.outputs.upload_tag }}
      flutter-version: '3.47.2'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  prepare_release:
    name: Prepare draft release
    needs: quality
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    outputs:
      upload_tag: ${{ steps.stage.outputs.upload_tag }}
      release_tag: ${{ steps.stage.outputs.release_tag }}
      expected_tag_sha: ${{ steps.stage.outputs.expected_tag_sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Create draft for this version
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          python3 tool/github_release.py stage --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --version "$VERSION" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --notes "$RUNNER_TEMP/bshare-release-notes.md" --github-output "$GITHUB_OUTPUT"

  result:
    name: Installer results
    needs: [quality, prepare_release, windows, linux, android, macos]
    if: always() && (github.ref_type == 'tag' || inputs.release_tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every installer to finish successfully
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = json.loads(os.environ['JOB_RESULTS'])
          lines = ['# BShare release builds', '', '| Job | Result |', '| --- | --- |']
          lines += [f"| {name} | {job['result']} |" for name, job in jobs.items()]
          lines += ['', 'Individual installer files are uploaded directly to the draft GitHub Release.']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Incomplete or failed jobs: ' + ', '.join(failed))
          PY

  publish:
    name: Verify and publish release files
    needs: [quality, prepare_release, windows, linux, android, macos, result]
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download draft release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.upload_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bshare-release-downloads"

      - name: Collect uncompressed release assets and checksums
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          python3 tool/prepare_release_assets.py \
            --input "$RUNNER_TEMP/bshare-release-downloads" \
            --output dist/release-assets \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --notes-output "$RUNNER_TEMP/bshare-release-notes.md"

      - name: Add checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
          UPLOAD_TAG: ${{ needs.prepare_release.outputs.upload_tag }}
          EXPECTED_TAG_SHA: ${{ needs.prepare_release.outputs.expected_tag_sha }}
          VERSION: ${{ needs.quality.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist/release-assets -maxdepth 1 -type f -print | sort)
          notes="$RUNNER_TEMP/bshare-release-notes.md"
          python3 tool/github_release.py publish --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --upload-tag "$UPLOAD_TAG" --commit "$GITHUB_SHA" \
            --expected-tag-sha "$EXPECTED_TAG_SHA" --assets dist/release-assets --notes "$notes"

          {
            echo '## Published files'
            printf '\n- `%s`\n' "${assets[@]##*/}"
            echo
            echo "[Open $RELEASE_TAG release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)."
          } >> "$GITHUB_STEP_SUMMARY"
