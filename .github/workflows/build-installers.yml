name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bshare-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-number: ${{ steps.metadata.outputs.build-number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve shared installer version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python3 tool/ci_metadata.py
          --run-number "$GITHUB_RUN_NUMBER"
          --github-output "$GITHUB_OUTPUT"
          --tag "$RELEASE_TAG"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ libgtk-3-dev pkg-config xvfb
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install verification tool dependencies
        run: python3 -m pip install --requirement tool/requirements-test.txt
      - name: Analyze Dart
        run: dart analyze --fatal-infos
      - name: Flutter regression suite
        run: flutter --suppress-analytics test --no-pub
      - name: Packaging and media verification tools
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Native Linux shutdown ownership
        run: python3 test/native/test_linux_window_shutdown.py
      - name: Native Linux window decorations
        run: xvfb-run -a python3 test/native/test_linux_native_decorations.py
      - name: Windows messenger shutdown ownership
        run: python3 third_party/flutter_webrtc/test/native/test_windows_messenger_lifecycle.py

  windows:
    name: Windows installer
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      flutter-version: '3.44.8'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  linux:
    name: Linux DEB and RPM
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      flutter-version: '3.44.8'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  android:
    name: Android signed APK
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/build-android.yml
    with:
      flutter-version: '3.44.8'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}
      require-signing: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  macos:
    name: macOS ARM64 and x64 DMGs
    needs: [quality, prepare_release]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      flutter-version: '3.44.8'
      version: ${{ needs.quality.outputs.version }}
      build-number: ${{ needs.quality.outputs.build-number }}

  prepare_release:
    name: Prepare draft release
    needs: quality
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Create draft for this version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          heading = f"## {os.environ['VERSION']}"
          try:
              start = lines.index(heading) + 1
          except ValueError:
              raise SystemExit(f'Missing changelog section: {heading}') from None
          end = next((index for index in range(start, len(lines)) if lines[index].startswith('## ')), len(lines))
          notes = '\n'.join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f'Empty changelog section: {heading}')
          Path(os.environ['RUNNER_TEMP'], 'bshare-release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [[ "$is_draft" == true ]] || { echo "Release $RELEASE_TAG is already published; use a new version tag." >&2; exit 1; }
            mapfile -t old_assets < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "BShare $VERSION" --notes-file "$RUNNER_TEMP/bshare-release-notes.md"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "BShare $VERSION" \
              --notes-file "$RUNNER_TEMP/bshare-release-notes.md"
          fi

  result:
    name: Installer results
    needs: [quality, prepare_release, windows, linux, android, macos]
    if: always() && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every installer to finish successfully
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = json.loads(os.environ['JOB_RESULTS'])
          lines = ['# BShare release builds', '', '| Job | Result |', '| --- | --- |']
          lines += [f"| {name} | {job['result']} |" for name, job in jobs.items()]
          lines += ['', 'Individual installer files are uploaded directly to the draft GitHub Release.']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Incomplete or failed jobs: ' + ', '.join(failed))
          PY

  publish:
    name: Verify and publish release files
    needs: [quality, windows, linux, android, macos, result]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download draft release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bshare-release-downloads"

      - name: Collect uncompressed release assets and checksums
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          python3 tool/prepare_release_assets.py \
            --input "$RUNNER_TEMP/bshare-release-downloads" \
            --output dist/release-assets \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --notes-output "$RUNNER_TEMP/bshare-release-notes.md"

      - name: Add checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.quality.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist/release-assets -maxdepth 1 -type f -print | sort)
          notes="$RUNNER_TEMP/bshare-release-notes.md"
          gh release upload "$RELEASE_TAG" dist/release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "BShare $VERSION" --notes-file "$notes" --draft=false

          {
            echo '## Published files'
            printf '\n- `%s`\n' "${assets[@]##*/}"
            echo
            echo "[Open BShare $VERSION release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)."
          } >> "$GITHUB_STEP_SUMMARY"
