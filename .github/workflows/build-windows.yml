name: Windows installer

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
      build-number:
        type: string
        required: false
        default: ''
      flutter-version:
        type: string
        required: false
        default: '3.47.2'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build-number }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify native virtual camera transport and source lifecycle
        run: |
          ./plugins/virtual-camera/scripts/build-windows.ps1 -BuildTests
          python test/native/test_windows_virtual_camera_cli.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows virtual-camera CLI compatibility regression failed.' }

      - name: Build Windows release
        run: |
          $arguments = @('build', 'windows', '--release', '--no-pub')
          if ($env:RELEASE_VERSION) { $arguments += "--build-name=$env:RELEASE_VERSION" }
          if ($env:RELEASE_BUILD_NUMBER) { $arguments += "--build-number=$env:RELEASE_BUILD_NUMBER" }
          & flutter @arguments
          if ($LASTEXITCODE -ne 0) { throw "Flutter exited with code $LASTEXITCODE." }

      - name: Verify Windows media routing and peer isolation
        run: |
          python test/native/test_windows_media_audio_routing.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows audio routing regression failed.' }
          python third_party/flutter_webrtc/test/native/test_peer_configuration_isolation.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop peer configuration isolation regression failed.' }
          python test/native/test_windows_camera_media_writer.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows JPEG and H264/AAC encoding regression failed.' }
          python test/native/test_desktop_camera_media_controller.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop capture and recording lifecycle regression failed.' }

      - name: Package installer and bundled C++ runtime
        run: ./packaging/windows/build-installer.ps1 -Version $env:RELEASE_VERSION -BuildNumber $env:RELEASE_BUILD_NUMBER

      - name: Verify install, launch and uninstall
        run: ./packaging/windows/smoke-test.ps1

      - name: Upload Windows installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dist/windows' -Filter '*-windows-x64-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)." }
          $arguments = @('release', 'upload', $env:RELEASE_TAG, $installers[0].FullName, '--repo', $env:GITHUB_REPOSITORY, '--clobber')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE." }
