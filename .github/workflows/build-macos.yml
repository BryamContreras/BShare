name: macOS installers

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Pinned Flutter SDK version
        type: string
        default: '3.47.2'
      version:
        description: Numeric release version; empty uses pubspec.yaml
        type: string
        default: ''
      build-number:
        description: Numeric build number; empty uses pubspec.yaml
        type: string
        default: ''
      release-tag:
        description: Destination draft release; empty uses the triggering tag
        type: string
        default: ''

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.architecture }} PKG
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            expected_architecture: arm64
            excluded_architecture: x86_64
          - architecture: x64
            runner: macos-15-intel
            expected_architecture: x86_64
            excluded_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      CI: true
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      MACOS_ARCH: ${{ matrix.architecture }}
      MACOS_EXPECTED_ARCH: ${{ matrix.expected_architecture }}
      FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ matrix.excluded_architecture }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build and verify architecture-specific PKG installation
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$BUILD_VERSION" ]]; then args+=(--build-name "$BUILD_VERSION"); fi
          if [[ -n "$BUILD_NUMBER" ]]; then args+=(--build-number "$BUILD_NUMBER"); fi
          flutter build macos --release --no-pub "${args[@]}"

          package_args=(--architecture "$MACOS_ARCH" --verify-install)
          if [[ -n "$BUILD_VERSION" ]]; then package_args+=(--version "$BUILD_VERSION"); fi
          if [[ -n "$BUILD_NUMBER" ]]; then package_args+=(--build-number "$BUILD_NUMBER"); fi
          python3 tool/packaging_macos.py "${package_args[@]}"

      - name: Upload macOS installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "dist/macos/BShare-"*.pkg --repo "$GITHUB_REPOSITORY" --clobber
